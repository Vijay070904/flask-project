<!DOCTYPE html>
<html>
<head>
    <title>To-Do Page</title>
</head>
<body>
    <h2>Add To-Do Item</h2>
    <form action="/submittodoitem" method="POST">
        <!-- item ID -->
        <input type="text" name="itemId" placeholder="Item ID"> 
        <!-- UUID -->
         <input type="text" name="itemUUID" placeholder="Item UUID">
        <input type="text" name="itemName" placeholder="Item Name"><br><br>
        <input type="text" name="itemDescription" placeholder="Item Description"><br><br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
